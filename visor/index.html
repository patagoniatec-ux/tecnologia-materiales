<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visor de producciones</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#14242e}.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.work{background:#fffefa;border:1px solid var(--line);padding:24px;border-radius:4px}.work h3{margin:8px 0}.work p{color:var(--muted);font-size:14px;white-space:pre-line}.work .button{margin:5px 6px 0 0}.work.empty{background:transparent;border-style:dashed}.work-meta{font-size:12px;color:var(--green)}.work-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.work-status{font-size:13px;color:var(--muted);margin:16px 0}.editor{color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;width:min(580px,95vw);max-height:90vh;padding:28px}.editor::backdrop{background:#102632bb}.editor label{display:block;margin:14px 0}.editor input,.editor textarea{width:100%;background:white;color:var(--ink);border:1px solid #9aa9ac;padding:10px;font:inherit;border-radius:3px}.editor textarea{min-height:110px;resize:vertical}.expo-view{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;border:0;padding:0;background:#14242e;color:white;overflow:hidden}.expo-view[open]{display:flex;flex-direction:column}.expo-top,.expo-controls{display:flex;align-items:center;gap:8px;padding:12px 18px;flex-wrap:wrap;background:#192e3b}.expo-top{justify-content:space-between}.expo-top h3{margin:0;font-size:19px}.expo-top p{font-size:13px;color:#cfdbdf;margin:4px 0 0}.expo-view button,.expo-view a{background:#294553;color:#fff;border:1px solid #65818b;border-radius:4px;padding:8px 12px;font:14px system-ui;text-decoration:none}.expo-view button:disabled{opacity:.4;cursor:default}.expo-reseña{margin:0;padding:10px 18px;background:#203946;color:#eef3f4;font-size:14px;white-space:pre-line;max-height:20vh;overflow:auto}.pdf-stage{flex:1;min-height:0;overflow:auto;touch-action:pan-x pan-y;cursor:grab;position:relative;overscroll-behavior:contain}.pdf-stage.dragging{cursor:grabbing;user-select:none}.pdf-sheet{position:relative;margin:auto;flex:none;background:white;box-shadow:0 2px 20px #0006}.pdf-sheet canvas{display:block;width:100%;height:100%}.pdf-space{min-width:100%;min-height:100%;width:max-content;padding:24px;display:flex;align-items:center;justify-content:center}.expo-message{padding:8px 18px;margin:0;font-size:13px;color:#d0dfe3}.expo-controls output{min-width:55px;text-align:center;font:13px monospace}.expo-controls .spacer{flex:1}.expo-controls label{display:flex;align-items:center;gap:7px}.expo-controls input{display:inline;width:55px;margin:0;padding:5px;color:white}.expo-hint{font-size:12px;color:#b9cbd0}.expo-view:fullscreen{height:100vh}.work button:disabled{opacity:.5}@media(max-width:650px){.work-grid{grid-template-columns:1fr}.expo-top,.expo-controls{padding:8px}.expo-hint{display:none}.expo-view button,.expo-view a{font-size:12px;padding:7px}.expo-reseña{font-size:12px}.expo-controls{gap:5px}.expo-top h3{font-size:15px}}@media print{#trabajos,.editor,.expo-view{display:none!important}} .expo-controls input{background:#14242e}.expo-view button:focus-visible,.pdf-stage:focus-visible{outline:3px solid #9fe0d1;outline-offset:2px}</style></head><body><dialog class="expo-view" id="pdf-view" aria-labelledby="pdf-title"><div class="expo-top"><div class="expo-identity"><p id="pdf-author"></p><p id="pdf-course"></p><h3 id="pdf-title"></h3></div><div class="work-tools"><button id="toggle-review">Ocultar reseña</button><button id="fullscreen-pdf">Pantalla completa</button><button id="close-pdf" aria-label="Cerrar visor">Cerrar ✕</button></div></div><p class="expo-reseña" id="pdf-review"></p><div class="expo-controls"><button id="prev-work">← Trabajo</button><button id="next-work">Trabajo →</button><button id="zoom-out" aria-label="Reducir zoom">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="Ampliar zoom">+</button><button id="fit-pdf">Ver lámina completa</button><button id="width-pdf">Ajustar al ancho</button><span class="spacer"></span><label>Página <input id="pdf-page" type="number" min="1" value="1"><span id="page-count"></span></label><a id="download-pdf" target="_blank" rel="noopener">Abrir original ↗</a></div><p class="expo-message" id="pdf-message" role="status">Preparando visor…</p><div class="pdf-stage" id="pdf-stage" tabindex="0" aria-label="Lámina ampliable. Arrastrá para recorrer; usá más y menos para ampliar."><div class="pdf-space"><div class="pdf-sheet" id="pdf-sheet"><canvas id="pdf-canvas"></canvas></div></div></div><p class="expo-message expo-hint">Arrastrá para recorrer · Rueda: desplazar · Ctrl + rueda: zoom · + / −: ampliar · F: ajustar · Flechas: recorrer · Esc: cerrar</p></dialog><script type="module" src="viewer.js"></script></body></html>
